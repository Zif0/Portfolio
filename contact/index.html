<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Zi Feng - Portfolio Website" />
    <title>Contact | Zi Feng</title>

    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/Pictures/logo.png" />
  </head>
  <body>
    <header>
      <nav class="navbar" aria-label="Main">
        <a href="/" aria-label="Home"
          ><img src="/Pictures/logo.png" id="logo" alt=""
        /></a>
        <button
          class="hamburger"
          id="hamburger"
          type="button"
          aria-expanded="false"
          aria-controls="navMenu"
          aria-label="Open menu"
        >
          &#9776;
        </button>
        <div class="mobileOverlay"></div>
        <ul class="navLinks" id="navMenu">
          <li class="navItem"><a href="/">Home</a></li>
          <li class="navItem"><a href="/projects">Projects</a></li>
          <li class="navItem"><a href="/resume">Resume</a></li>
          <li class="navItem"><a href="/contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section id="project-welcome">
        <div class="welcome-card">
          <div class="welcome-text">
            <h1>Contact</h1>
            <p class="tagline">Say hello — I'll get back to you.</p>
          </div>
          <div class="separator" aria-hidden="true"></div>
        </div>
      </section>

      <section id="contact">
        <form
          id="contactForm"
          action="https://formsubmit.co/92de23b0ce1f60931cfc813010f0bfd6"
          method="POST"
        >
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <div id="scrollHint">
      <div class="arrowBounce" aria-hidden="true">↓</div>
      <p>Scroll for more</p>
    </div>

    <footer>
      <p>© 2026 Zi Feng. All rights reserved.</p>
      <div class="socialLinks">
        <a href="https://www.linkedin.com/in/zifeng1" target="_blank" rel="noopener noreferrer"
          ><img
            src="https://static.vecteezy.com/system/resources/previews/018/930/480/non_2x/linkedin-logo-linkedin-icon-transparent-free-png.png"
            alt="LinkedIn"
            class="socials"
            id="linkedin-footer"
        /></a>
        <a href="https://www.github.com/Zif0" target="_blank" rel="noopener noreferrer"
          ><img
            src="/Pictures/github.png"
            alt="GitHub"
            class="socials"
            id="github-footer"
        /></a>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
